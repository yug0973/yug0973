<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05060f"/>
      <stop offset="0.6" stop-color="#0b1030"/>
      <stop offset="1" stop-color="#3a0610"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#e62429" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#e62429" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
    <style>
      .web{fill:none;stroke:#cfd8ff;stroke-width:1.2;opacity:.28;stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 3.5s ease-out forwards}
      .web2{animation-delay:.8s;opacity:.2}
      @keyframes draw{to{stroke-dashoffset:0}}
      .title{font-family:'Segoe UI',Impact,Arial Black,sans-serif;font-weight:900;font-size:120px;letter-spacing:6px}
      .sub{font-family:'Segoe UI',Arial,sans-serif;font-size:22px;letter-spacing:5px;fill:#9fb0ff}
      .tag{font-family:'Courier New',monospace;font-size:16px;fill:#e62429}
      .blink{animation:blink 1.2s steps(2) infinite}
      @keyframes blink{50%{opacity:0}}
    </style>
  </defs>
  <rect width="1000" height="320" fill="url(#bg)"/>
  <rect width="1000" height="320" fill="url(#glow)"/>

  <!-- web, anchored top-right -->
  <g>
    <path class="web" d="M1000 0 L560 320"/>
    <path class="web" d="M1000 0 L700 320"/>
    <path class="web" d="M1000 0 L850 320"/>
    <path class="web" d="M1000 0 L1000 320"/>
    <path class="web" d="M1000 0 L420 230"/>
    <path class="web" d="M1000 0 L400 90"/>
    <path class="web web2" d="M930 0 Q900 70 940 140 M780 0 Q760 100 820 200 M860 0 Q820 100 880 170"/>
    <path class="web web2" d="M1000 90 Q930 100 880 150 Q820 170 760 215 Q700 235 640 270"/>
    <path class="web web2" d="M1000 170 Q940 180 900 215 Q860 240 820 275"/>
    <path class="web web2" d="M1000 40 Q950 50 915 90 Q880 110 840 130 Q790 150 740 170"/>
  </g>

  <!-- swinging spider -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-14 820 0;14 820 0;-14 820 0" dur="4.5s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" keyTimes="0;.5;1"/>
    <line x1="820" y1="0" x2="820" y2="170" stroke="#e8edff" stroke-width="1.6" opacity=".8"/>
    <g stroke="#0a0a0a" stroke-width="3.5" fill="none" stroke-linecap="round">
      <path d="M820 188 L792 170 L778 182"/><path d="M820 192 L788 190 L774 206"/>
      <path d="M820 198 L792 214 L782 232"/><path d="M820 202 L800 230 L796 248"/>
      <path d="M820 188 L848 170 L862 182"/><path d="M820 192 L852 190 L866 206"/>
      <path d="M820 198 L848 214 L858 232"/><path d="M820 202 L840 230 L844 248"/>
    </g>
    <ellipse cx="820" cy="205" rx="17" ry="24" fill="#e62429"/>
    <ellipse cx="820" cy="205" rx="6" ry="14" fill="#0a0a0a"/>
    <circle cx="820" cy="178" r="12" fill="#1b2fc4"/>
    <ellipse cx="815" cy="176" rx="3.5" ry="2.2" fill="#fff"/>
    <ellipse cx="825" cy="176" rx="3.5" ry="2.2" fill="#fff"/>
  </g>

  <!-- glitch title -->
  <g class="title">
    <text x="60" y="170" fill="#00e5ff" opacity=".8">YUG
      <animate attributeName="x" values="56;64;58;60;56" dur="2.2s" repeatCount="indefinite"/>
    </text>
    <text x="60" y="170" fill="#e62429" opacity=".85">YUG
      <animate attributeName="x" values="64;57;62;60;64" dur="1.7s" repeatCount="indefinite"/>
    </text>
    <text x="60" y="170" fill="#ffffff">YUG</text>
  </g>
  <text class="sub" x="64" y="218">FULL-STACK DEVELOPER</text>
  <text class="tag" x="64" y="256">&gt; friendly neighborhood coder<tspan class="blink">_</tspan></text>
  <line x1="64" y1="272" x2="420" y2="272" stroke="#e62429" stroke-width="3">
    <animate attributeName="x2" values="64;420;420" keyTimes="0;.4;1" dur="3s" fill="freeze"/>
  </line>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
